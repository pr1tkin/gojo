name: Release Candidate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Install dependencies
        run: npm ci
        working-directory: mcp-server

      - name: Lint
        run: npm run lint
        working-directory: mcp-server

      - name: Build
        run: npm run build
        working-directory: mcp-server

      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: mcp-server

      - name: Print coverage summary
        shell: bash
        working-directory: mcp-server
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs"); const summary=JSON.parse(fs.readFileSync("coverage/coverage-summary.json","utf8")).total; for (const key of ["lines","statements","functions","branches"]) { const metric=summary[key]; console.log(key + ": " + metric.pct + "% (" + metric.covered + "/" + metric.total + ")"); }'
          {
            echo "## Coverage"
            echo
            echo "- Artifact: \`gojo-release-candidate-coverage\`"
            echo "- Open the workflow run artifacts to download the full HTML and LCOV reports."
            echo
            echo "| Metric | Coverage |"
            echo "|---|---:|"
            node -e 'const fs=require("node:fs"); const summary=JSON.parse(fs.readFileSync("coverage/coverage-summary.json","utf8")).total; for (const key of ["lines","statements","functions","branches"]) { const metric=summary[key]; console.log("| " + key + " | " + metric.pct + "% |"); }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build bundled search helpers
        shell: bash
        run: |
          set -euo pipefail
          ZOEKT_REF=$(node -e "const fs=require('node:fs'); const manifest=JSON.parse(fs.readFileSync('mcp-server/bin/search/manifest.json','utf8')); process.stdout.write(manifest.zoektRef);")
          mkdir -p "$RUNNER_TEMP/gojo-helpers"
          GOBIN="$RUNNER_TEMP/gojo-helpers" go install "github.com/sourcegraph/zoekt/cmd/zoekt-webserver@${ZOEKT_REF}"
          GOBIN="$RUNNER_TEMP/gojo-helpers" go install "github.com/sourcegraph/zoekt/cmd/zoekt-git-index@${ZOEKT_REF}"
          echo "GOJO_ZOEKT_WEBSERVER_PATH=$RUNNER_TEMP/gojo-helpers/zoekt-webserver" >> "$GITHUB_ENV"
          echo "GOJO_ZOEKT_GIT_INDEX_PATH=$RUNNER_TEMP/gojo-helpers/zoekt-git-index" >> "$GITHUB_ENV"

      - name: Run release candidate flow
        env:
          GOJO_REPO_ROOT: ${{ github.workspace }}
          GOJO_RELEASE_STAGING_ROOT: ${{ runner.temp }}/gojo-release-stage
          GOJO_HOME: ${{ runner.temp }}/gojo-home
        run: ./mcp-server/node_modules/.bin/tsx scripts/release/run-release-candidate.ts

      - name: Upload release candidate outputs
        uses: actions/upload-artifact@v4
        with:
          name: gojo-release-candidate
          path: |
            dist/release/**
            docs/release/release-artifact-report.md
          if-no-files-found: error

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: gojo-release-candidate-coverage
          path: mcp-server/coverage/**
          if-no-files-found: error
