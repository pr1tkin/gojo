# Development-only local stack.
# This file is not the primary product entrypoint. Official product usage should
# go through the `gojo` CLI, especially `gojo mcp serve` for MCP serving.
services:
  zoekt:
    build:
      context: ./zoekt
    command: ["zoekt-webserver", "-listen", ":6070", "-index", "/data/index"]
    ports:
      - "6070:6070"
    volumes:
      - ./repos:/repos:ro
      - zoekt-index:/data/index

  zoekt-indexer:
    build:
      context: ./zoekt
    command: ["/usr/local/bin/index-repos.sh"]
    environment:
      INDEX_INTERVAL_SECONDS: ${INDEX_INTERVAL_SECONDS:-300}
    volumes:
      - ./repos:/repos:ro
      - zoekt-index:/data/index
      - refresh-coordination:/data/coordination

  mcp-server:
    build:
      context: ./mcp-server
    depends_on:
      - zoekt
    command: ["node", "dist/gojo.js", "mcp", "serve"]
    volumes:
      - ./repos:/repos:ro
      - mcp-server-data:/app/.data
      - refresh-coordination:/app/.data/coordination

volumes:
  zoekt-index:
  refresh-coordination:
  mcp-server-data:
